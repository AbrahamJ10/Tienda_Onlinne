<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso Oficina - Tienda M&S</title>
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-panel">
        <div class="logo-area">
          <h1>Tienda <span>M&S</span></h1>
          <p>Panel Administrativo</p>
        </div>

        <form id="formLogin">
          <div class="input-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" required />
          </div>

          <div class="input-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required />
          </div>

          <button type="submit">Ingresar</button>
          <p id="mensaje-error" class="mensaje-error"></p>
        </form>
      </div>

      <div class="login-image"></div>
    </div>

    <script>
      document
        .getElementById("formLogin")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;
          const msg = document.getElementById("mensaje-error");
          msg.textContent = "";

          try {
            const res = await fetch("/api/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, password }),
            });

            const data = await res.json();

            if (res.ok) {
              window.location.href = "almacen.html"; // ✅ Redirige al panel
            } else {
              msg.textContent = data.error || "Credenciales inválidas";
            }
          } catch (err) {
            msg.textContent = "Error de conexión con el servidor";
          }
        });
    </script>
  </body>
</html>
