<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Almacén | Tienda Onlinne M&S</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>Lista de Productos</h1>

    <div class="acciones-superior">
      <button id="btnAgregar">+ Agregar Producto</button>
      <button id="btnTipo">+ Agregar Tipo</button>
      <button id="btnMarca">+ Agregar Marca</button>
    </div>

    <!-- 🔍 FILTROS -->
    <section id="filtros">
      <div class="filtro-contenedor">
        <input
          type="text"
          id="filtroGeneral"
          placeholder="🔍 Buscar por descripción, tipo o marca..."
        />
        <select id="filtroEstado">
          <option value="">-- Estado --</option>
          <option value="Disponible">Disponible</option>
          <option value="Agotado">Agotado</option>
        </select>
        <input type="number" id="filtroStockMin" placeholder="Stock mínimo" />
        <input type="date" id="filtroFV" />
        <button id="btnLimpiarFiltros">🧹 Limpiar</button>
      </div>
    </section>

    <!-- 📦 TABLA DE PRODUCTOS -->
    <table id="tablaProductos">
      <thead>
        <tr>
          <th>ID</th>
          <th>Fecha</th>
          <th>Tipo</th>
          <th>Marca</th>
          <th>Cant</th>
          <th>Descripción</th>
          <th>FV</th>
          <th>Stock</th>
          <th>Costo</th>
          <th>Imagen</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <!-- 🪟 POPUP PRODUCTO -->
    <div id="overlay"></div>
    <div id="popupForm">
      <form id="formProducto" enctype="multipart/form-data">
        <h2>Producto</h2>
        <select id="id_tipo" name="id_tipo" required></select>
        <select id="id_marca" name="id_marca" required></select>
        <input name="peso" placeholder="Peso" required />
        <input name="descripcion" placeholder="Descripción" required />
        <input type="date" name="fv" />
        <input type="number" name="stock" placeholder="Stock" />
        <input type="number" step="0.01" name="costo" placeholder="Costo" />
        <select name="estado" id="estado" required>
          <option value="Disponible">Disponible</option>
          <option value="Agotado">Agotado</option>
        </select>
        <input type="file" name="imagen" />
        <div class="popup-buttons">
          <button type="submit">Guardar</button>
          <button type="button" id="cerrarBtn">Cerrar</button>
        </div>
      </form>
    </div>

    <!-- 🪟 POPUP TIPO -->
    <div id="popupTipo" class="popup-mini">
      <h2>Gestionar Tipos</h2>
      <input id="nuevoTipo" placeholder="Nuevo tipo..." />
      <button id="agregarTipo">Agregar</button>
      <ul id="listaTipos"></ul>
      <button id="cerrarTipo">Cerrar</button>
    </div>

    <!-- 🪟 POPUP MARCA -->
    <div id="popupMarca" class="popup-mini">
      <h2>Gestionar Marcas</h2>
      <input id="nuevaMarca" placeholder="Nueva marca..." />
      <button id="agregarMarca">Agregar</button>
      <ul id="listaMarcas"></ul>
      <button id="cerrarMarca">Cerrar</button>
    </div>

    <script src="js/app.js" defer></script>
  </body>
</html>
